  <script>
    // Icon self-healing: a missing icon name renders as INVISIBLE empty space
    // (iconify-icon fails silently). Its `status` property ('rendered' |
    // 'loading' | 'failed') lets us swap failures to a neutral glyph.
    (function() {
      var els = document.querySelectorAll('iconify-icon');
      for (var i = 0; i < els.length; i++) (function(el) {
        var tries = 0;
        (function check() {
          var s = el.status;
          if (s === 'failed') el.setAttribute('icon', 'lucide:circle');
          else if (s !== 'rendered' && tries++ < 40) setTimeout(check, 250);
        })();
      })(els[i]);
    })();
  </script>
