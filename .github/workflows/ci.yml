name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Swarm.IO.slnx
      - run: dotnet build Swarm.IO.slnx --configuration Release --no-restore
      - run: dotnet run --project tests/Swarm.Tests/Swarm.Tests.csproj --configuration Release --no-build
